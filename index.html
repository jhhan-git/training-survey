<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상업교과교육연구회 공개 연수 만족도 조사</title>
<meta name="description" content="2026학년도 상업교과교육연구회 공개 연수 만족도 조사">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="lede">안녕하세요! 본 설문은 공개 연수에 대한 만족도 조사입니다. 연수에 대한 의견을 주시면 다음 번 연수 계획에 참고하도록 하겠습니다. 감사합니다!</p>
  </header>

  <div class="panel"><dl class="info" id="info"></dl></div>

  <form id="form" novalidate>
    <div id="sections" style="display:grid;gap:28px"></div>

    <section class="section" style="margin-top:28px">
      <div class="section-head"><span class="num">4</span><h2>기타</h2></div>
      <div class="q" id="q-comment">
        <label class="qtext" for="comment"><span id="comment-text"></span><span class="req">*</span></label>
        <textarea id="comment" maxlength="2000" placeholder="자유롭게 적어 주세요"></textarea>
      </div>
    </section>

    <div class="actions">
      <div class="progress"><span id="progress-text">0 / 14 응답</span><span>* 모든 문항 필수</span></div>
      <div class="bar"><i id="progress-bar"></i></div>
      <button type="submit" class="primary" id="submit">제출하기</button>
      <p class="status" id="status" role="status"></p>
    </div>
  </form>

  <div class="panel done" id="done" hidden>
    <div class="check">✓</div>
    <h2>응답해 주셔서 감사합니다</h2>
    <p class="lede">주신 의견은 다음 연수 계획에 반영하겠습니다.</p>
    <div><button type="button" class="ghost" id="edit">응답 수정하기</button></div>
  </div>

  <footer>상업교과교육연구회</footer>
</div>

<script src="survey.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const TOTAL = SURVEY.sections.reduce((n, s) => n + s.items.length, 0) + 1;

// 이 브라우저를 구분하는 번호. 같은 기기에서 다시 제출하면 기존 응답이 고쳐집니다(중복 방지).
const KEY = "training-survey-2026-1028";
let rid = null;
try { rid = localStorage.getItem(KEY + ":id"); } catch {}
if (!rid) {
  rid = crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
  try { localStorage.setItem(KEY + ":id", rid); } catch {}
}

$("eyebrow").textContent = SURVEY.eyebrow;
$("title").textContent = SURVEY.title;
$("comment-text").textContent = SURVEY.comment;
$("info").replaceChildren(...SURVEY.info.flatMap(([k, v]) => {
  const dt = document.createElement("dt"); dt.textContent = k;
  const dd = document.createElement("dd"); dd.textContent = v;
  return [dt, dd];
}));

let qi = 0;
$("sections").replaceChildren(...SURVEY.sections.map((sec, si) => {
  const box = document.createElement("section"); box.className = "section";
  const head = document.createElement("div"); head.className = "section-head";
  const num = document.createElement("span"); num.className = "num"; num.textContent = si + 1;
  const h = document.createElement("h2"); h.textContent = sec.title;
  head.append(num, h); box.append(head);
  sec.items.forEach((text, ii) => {
    const idx = qi++;
    const fs = document.createElement("fieldset"); fs.className = "q"; fs.id = "q" + idx;
    const lg = document.createElement("legend");
    lg.textContent = `${ii + 1}. ${text}`;
    const star = document.createElement("span"); star.className = "req"; star.textContent = "*"; lg.append(star);
    const scale = document.createElement("div"); scale.className = "scale";
    SURVEY.scale.forEach((lab, v) => {
      const l = document.createElement("label");
      const inp = document.createElement("input"); inp.type = "radio"; inp.name = "q" + idx; inp.value = v + 1;
      const dot = document.createElement("span"); dot.className = "dot"; dot.textContent = v + 1;
      const t = document.createElement("span"); t.className = "lab"; t.textContent = lab;
      l.append(inp, dot, t); scale.append(l);
    });
    fs.append(lg, scale); box.append(fs);
  });
  return box;
}));
const NQ = qi;

function answers() {
  const scores = [];
  for (let i = 0; i < NQ; i++) {
    const c = document.querySelector(`input[name="q${i}"]:checked`);
    scores.push(c ? Number(c.value) : null);
  }
  return { scores, comment: $("comment").value.trim() };
}
function saveDraft() {
  try { localStorage.setItem(KEY + ":draft", JSON.stringify(answers())); } catch {}
}
function updateProgress() {
  const a = answers();
  const n = a.scores.filter((s) => s).length + (a.comment ? 1 : 0);
  $("progress-text").textContent = `${n} / ${TOTAL} 응답`;
  $("progress-bar").style.width = (n / TOTAL * 100) + "%";
}
function loadDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY + ":draft") || "null"); } catch {}
  if (!d) return;
  (d.scores || []).forEach((s, i) => {
    if (!s) return;
    const el = document.querySelector(`input[name="q${i}"][value="${s}"]`);
    if (el) el.checked = true;
  });
  if (d.comment) $("comment").value = d.comment;
}
function setStatus(msg, warn) { $("status").textContent = msg; $("status").classList.toggle("warn", !!warn); }

$("form").addEventListener("change", (e) => {
  const fs = e.target.closest(".q"); if (fs) fs.classList.remove("missing");
  saveDraft(); updateProgress();
});
$("comment").addEventListener("input", () => { $("q-comment").classList.remove("missing"); saveDraft(); updateProgress(); });

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const a = answers();
  let firstMissing = null;
  a.scores.forEach((s, i) => { const fs = $("q" + i); fs.classList.toggle("missing", !s); if (!s && !firstMissing) firstMissing = fs; });
  $("q-comment").classList.toggle("missing", !a.comment);
  if (!a.comment && !firstMissing) firstMissing = $("q-comment");
  if (firstMissing) {
    setStatus("응답하지 않은 문항이 있어요. 빨간 테두리 문항을 확인해 주세요.", true);
    firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  $("submit").disabled = true; setStatus("제출 중…");
  try {
    await rpc("submit_training_survey", { p_id: rid, p_scores: a.scores, p_comment: a.comment });
    try { localStorage.setItem(KEY + ":done", "1"); } catch {}
    setStatus("");
    showDone(true);
  } catch (err) {
    console.error(err);
    setStatus("제출하지 못했어요. 잠시 후 다시 눌러 주세요. (오류: " + (err.message || err) + ")", true);
  } finally {
    $("submit").disabled = false;
  }
});

function showDone(on) {
  $("form").hidden = on; $("done").hidden = !on;
  document.querySelector(".info").closest(".panel").hidden = on;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("edit").onclick = () => { $("submit").textContent = "수정해서 다시 제출하기"; showDone(false); };

loadDraft(); updateProgress();
let wasDone = false; try { wasDone = localStorage.getItem(KEY + ":done") === "1"; } catch {}
if (wasDone) showDone(true);
</script>
</body>
</html>
